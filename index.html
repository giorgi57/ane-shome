<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ეწ-ს ჰოუმ - მთავარი</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }

        /* პროდუქტების ბადე */
        #productsContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* პროდუქტის ბარათი */
        .product-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            width: 240px;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            background: #eee;
        }
        .product-card h3 {
            font-size: 16px;
            margin: 12px 0 8px 0;
            color: #222;
        }
        .product-card p {
            color: #28a745;
            font-weight: bold;
            font-size: 18px;
            margin: 0;
        }

        /* მოდალური ფანჯარა (დეტალური ნახვა და გალერეა) */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.8); 
            overflow: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: #fff;
            margin: 40px auto;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 600px;
            position: relative;
            box-sizing: border-box;
        }
        .close-btn {
            color: #555;
            float: right;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }
        .close-btn:hover { color: #000; }

        .modal-main-image-container {
            position: relative;
            width: 100%;
            height: 350px;
            background: #111;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-main-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .gallery-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            cursor: pointer;
            padding: 12px 16px;
            font-size: 18px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .gallery-arrow:hover { background: rgba(0,0,0,0.9); }
        .prev-arrow { left: 10px; }
        .next-arrow { right: 10px; }

        .modal-thumbnails {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .modal-thumb {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.6;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .modal-thumb.active {
            border-color: #28a745;
            opacity: 1;
        }

        /* მცურავი WhatsApp ღილაკი */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 999;
            transition: transform 0.2s;
        }
        .whatsapp-float:hover { transform: scale(1.1); }
        .whatsapp-float svg { width: 35px; height: 35px; fill: white; }

        @media (max-width: 600px) {
            .modal-content { margin: 20px auto; padding: 15px; width: 95%; }
            .modal-main-image-container { height: 250px; }
            .product-card { width: 100%; max-width: 300px; margin: 0 auto; }
        }
    </style>
</head>
<body>

<h1>ეწ-ს ჰოუმ - პროდუქტები</h1>

<div id="productsContainer">იტვირთება პროდუქტები...</div>

<!-- პროდუქტის დეტალური გალერეის მოდალი -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        
        <div class="modal-main-image-container">
            <button class="gallery-arrow prev-arrow" onclick="changeImage(-1)">&#10094;</button>
            <img id="modalMainImg" class="modal-main-image" src="" alt="პროდუქტის ფოტო">
            <button class="gallery-arrow next-arrow" onclick="changeImage(1)">&#10095;</button>
        </div>

        <div id="modalThumbnails" class="modal-thumbnails"></div>

        <h2 id="modalTitle" style="margin-top: 15px; color: #333;"></h2>
        <p id="modalPrice" style="color: #28a745; font-size: 20px; font-weight: bold;"></p>
        <p id="modalDescription" style="color: #555; line-height: 1.5;"></p>
    </div>
</div>

<!-- მცურავი WhatsApp ღილაკი (ჩასვი შენი ნომერი wa.me/-ს შემდეგ) -->
<a href="https://wa.me/9955XXXXXXXX" class="whatsapp-float" target="_blank" title="მოგვწერეთ WhatsApp-ში">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">

<!-- Firebase SDK-ები -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAzlIn043F7-ufK8xFlifDvj75zI1NsulM",
        authDomain: "ane-s-home.firebaseapp.com",
        projectId: "ane-s-home",
        storageBucket: "ane-s-home.appspot.com",
        messagingSenderId: "484380648627",
        appId: "1:484380648627:web:6e60a13212c65e02fdfcc6"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const productsContainer = document.getElementById('productsContainer');
    const modal = document.getElementById('productModal');
    const closeBtn = document.querySelector('.close-btn');
    const modalMainImg = document.getElementById('modalMainImg');
    const modalThumbnails = document.getElementById('modalThumbnails');

    let currentProductImages = [];
    let currentImageIndex = 0;

    async function loadProducts() {
        try {
            const snapshot = await db.collection('products').orderBy('createdAt', 'desc').get();
            productsContainer.innerHTML = '';

            if (snapshot.empty) {
                productsContainer.innerHTML = '<p>პროდუქტები ჯერ არ არის დამატებული.</p>';
                return;
            }

            snapshot.forEach(doc => {
                const product = doc.data();
                const card = document.createElement('div');
                card.classList.add('product-card');

                const mainImage = product.images && product.images.length > 0 ? product.images[0] : 'https://via.placeholder.com/180?text=No+Image';

                card.innerHTML = `
                    <img src="${mainImage}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/180?text=No+Image'">
                    <h3>${product.name}</h3>
                    <p>${product.price} ₾</p>
                `;

                card.addEventListener('click', () => {
                    openProductModal(product);
                });

                productsContainer.appendChild(card);
            });
        } catch (error) {
            console.error("შეცდომა პროდუქტების ჩატვირთვისას: ", error);
            productsContainer.innerHTML = '<p>პროდუქტების ჩატვირთვა ვერ მოხერხდა.</p>';
        }
    }

    function openProductModal(product) {
        document.getElementById('modalTitle').textContent = product.name;
        document.getElementById('modalPrice').textContent = `${product.price} ₾`;
        document.getElementById('modalDescription').textContent = product.description || 'აღწერა არ არის';

        currentProductImages = product.images && product.images.length > 0 ? product.images : ['https://via.placeholder.com/300?text=No+Image'];
        currentImageIndex = 0;

        updateMainImage();
        renderThumbnails();

        modal.style.display = 'block';
    }

    function updateMainImage() {
        modalMainImg.src = currentProductImages[currentImageIndex];
        const thumbs = modalThumbnails.querySelectorAll('.modal-thumb');
        thumbs.forEach((thumb, idx) => {
            if (idx === currentImageIndex) {
                thumb.classList.add('active');
            } else {
                thumb.classList.remove('active');
            }
        });
    }

    function changeImage(direction) {
        currentImageIndex += direction;
        if (currentImageIndex < 0) {
            currentImageIndex = currentProductImages.length - 1;
        } else if (currentImageIndex >= currentProductImages.length) {
            currentImageIndex = 0;
        }
        updateMainImage();
    }

    function renderThumbnails() {
        modalThumbnails.innerHTML = '';
        currentProductImages.forEach((imgUrl, index) => {
            const thumb = document.createElement('img');
            thumb.src = imgUrl;
            thumb.classList.add('modal-thumb');
            if (index === 0) thumb.classList.add('active');

            thumb.addEventListener('click', () => {
                currentImageIndex = index;
                updateMainImage();
            });

            modalThumbnails.appendChild(thumb);
        });
    }

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
    });

    window.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });

    loadProducts();
</script>

</body>
</html>
