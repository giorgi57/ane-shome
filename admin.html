<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ane's home - ადმინ პანელი</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; color: #333; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #444; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="file"] { width: 100%; padding: 5px; }
        
        #previewContainer {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .preview-thumb {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        button { background: #28a745; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background: #218838; }
        #loading { display: none; text-align: center; color: #007bff; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>პროდუქტის დამატება</h2>
    <form id="productForm">
        <div class="form-group">
            <label for="productName">პროდუქტის დასახელება:</label>
            <input type="text" id="productName" required>
        </div>

        <div class="form-group">
            <label for="productCategory">კატეგორია:</label>
            <select id="productCategory" required onchange="updateSizes()">
                <option value="">აირჩიეთ კატეგორია</option>
                <option value="თეთრეული">თეთრეული</option>
                <option value="გადასაფარებელი">გადასაფარებელი</option>
                <option value="ბალიში და საბანი">ბალიში და საბანი</option>
                <option value="პირსახოცები">პირსახოცები</option>
                <option value="ხალათები">ხალათები</option>
                <option value="ფარდები">ფარდები</option>
                <option value="მაგიდის გადასაფარებელი">მაგიდის გადასაფარებელი</option>
                <option value="სხვა ტექსტილი">სხვა ტექსტილი</option>
            </select>
        </div>

        <div class="form-group" id="sizeGroup" style="display: none;">
            <label for="productSize">ზომა:</label>
            <select id="productSize"></select>
        </div>

        <div class="form-group">
            <label for="productPrice">ფასი (₾):</label>
            <input type="number" id="productPrice" required>
        </div>

        <div class="form-group">
            <label for="productDiscount">ფასდაკლება (% - სურვილისამებრ):</label>
            <input type="number" id="productDiscount" placeholder="მაგ: 15" min="0" max="100">
        </div>

        <div class="form-group">
            <label for="productDescription">აღწერა / ისტორია:</label>
            <textarea id="productDescription" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label for="productImages">ფოტოები (მინიმუმ 1, მაქსიმუმ 5):</label>
            <input type="file" id="productImages" accept="image/*" multiple required>
            <div id="previewContainer"></div>
        </div>

        <button type="submit" id="submitBtn">პროდუქტის ატვირთვა</button>
        <div id="loading">იტვირთება ფოტოები და ინახება მონაცემები... გთხოვთ მოიცადოთ.</div>
    </form>
</div>

<!-- Firebase Compat სკრიპტები -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAzlIn043F7-ufK8xFlifDvj75zI1NsulM",
        authDomain: "ane-s-home.firebaseapp.com",
        projectId: "ane-s-home",
        storageBucket: "ane-s-home.firebasestorage.app", // ზუსტი ბაკეტის სახელი
        messagingSenderId: "484380648627",
        appId: "1:484380648627:web:6e60a13212c65e02fdfcc6"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const storage = firebase.storage();

    const productForm = document.getElementById('productForm');
    const loadingDiv = document.getElementById('loading');
    const submitBtn = document.getElementById('submitBtn');
    const fileInput = document.getElementById('productImages');
    const previewContainer = document.getElementById('previewContainer');
    const categorySelect = document.getElementById('productCategory');
    const sizeGroup = document.getElementById('sizeGroup');
    const sizeSelect = document.getElementById('productSize');

    function updateSizes() {
        const cat = categorySelect.value;
        sizeSelect.innerHTML = '';
        let sizes = [];
        if (cat === 'თეთრეული') {
            sizes = ['ერთადგილიანი', 'ორადგილიანი', 'ევრო', 'ოჯახური'];
        } else if (cat === 'ბალიში და საბანი') {
            sizes = ['50x70 სმ', '70x70 სმ', '140x200 სმ (საბანი)', '200x220 სმ (საბანი)'];
        } else if (cat === 'პირსახოცები') {
            sizes = ['პატარა (სახის)', 'საშუალო (ხელის)', 'დიდი (აბაზანის)'];
        } else if (cat === 'ხალათები') {
            sizes = ['S / M', 'L / XL', '2XL'];
        } else if (cat === 'ფარდები' || cat === 'მაგიდის გადასაფარებელი') {
            sizes = ['სტანდარტული', 'ინდივიდუალური შეკვეთით'];
        }

        if (sizes.length > 0) {
            sizeGroup.style.display = 'block';
            sizes.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                sizeSelect.appendChild(opt);
            });
        } else {
            sizeGroup.style.display = 'none';
        }
    }

    fileInput.addEventListener('change', (e) => {
        previewContainer.innerHTML = '';
        const files = e.target.files;
        if (files.length > 5) {
            alert('მაქსიმუმ შეგიძლიათ აირჩიოთ 5 ფოტო!');
            fileInput.value = '';
            return;
        }
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.createElement('img');
                img.src = event.target.result;
                img.classList.add('preview-thumb');
                previewContainer.appendChild(img);
            }
            reader.readAsDataURL(file);
        }
    });

    productForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const files = fileInput.files;

        if (files.length === 0) {
            alert('გთხოვთ აირჩიოთ მინიმუმ ერთი ფოტო!');
            return;
        }

        loadingDiv.style.display = 'block';
        submitBtn.disabled = true;

        try {
            let imageUrls = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const storageRef = storage.ref().child(`products/${Date.now()}_${i}_${file.name}`);
                const snapshot = await storageRef.put(file);
                const downloadURL = await snapshot.ref.getDownloadURL();
                imageUrls.push(downloadURL);
            }

            await db.collection('products').add({
                name: document.getElementById('productName').value,
                category: categorySelect.value,
                size: sizeGroup.style.display !== 'none' ? sizeSelect.value : '',
                price: Number(document.getElementById('productPrice').value),
                discount: Number(document.getElementById('productDiscount').value) || 0,
                history: document.getElementById('productDescription').value,
                images: imageUrls,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            loadingDiv.style.display = 'none';
            submitBtn.disabled = false;
            alert('პროდუქტი წარმატებით დაემატა!');
            productForm.reset();
            previewContainer.innerHTML = '';
            sizeGroup.style.display = 'none';

        } catch (error) {
            loadingDiv.style.display = 'none';
            submitBtn.disabled = false;
            console.error('შეცდომა:', error);
            alert('ატვირთვა ვერ მოხერხდა. ზუსტი მიზეზი: ' + error.message);
        }
    });
</script>

</body>
</html>
