<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ane's Home - ადმინ პანელი</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .product-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .product-info img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .delete-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <div class="header-container">
            <a href="index.html" class="logo">ane's <span>home</span> <small>ადმინ პანელი</small></a>
        </div>
    </header>

    <div class="container">
        <!-- ავტორიზაციის კარტა -->
        <div id="authCard" class="auth-card">
            <h2>ადმინისტრატორის ავტორიზაცია</h2>
            <div class="form-group">
                <label for="adminUser">მომხმარებელი (ელ-ფოსტა):</label>
                <input type="text" id="adminUser" placeholder="admin@aneshome.ge" value="admin@aneshome.ge">
            </div>
            <div class="form-group">
                <label for="adminPass">პაროლი:</label>
                <input type="password" id="adminPass" placeholder="შეიყვანეთ პაროლი">
            </div>
            <button id="loginBtn">შესვლა</button>
            <div id="loginLoading" style="display: none; text-align: center; color: #b89733; margin-top: 10px; font-weight: bold;">მოწმდება მონაცემები...</div>
        </div>

        <!-- რეალური პროდუქტის დამატების და მართვის ფორმა -->
        <div id="adminContent" class="auth-card hidden" style="max-width: 800px;">
            <h2>პროდუქტის დამატება</h2>
            <form id="productForm">
                <div class="form-group">
                    <label for="productName">პროდუქტის დასახელება:</label>
                    <input type="text" id="productName" required>
                </div>

                <div class="form-group">
                    <label for="productCategory">კატეგორია:</label>
                    <select id="productCategory" required onchange="updateSizes()">
                        <option value="">აირჩიეთ კატეგორია</option>
                        <option value="თეთრეული">თეთრეული</option>
                        <option value="გადასაფარებელი">გადასაფარებელი</option>
                        <option value="ბალიში და საბანი">ბალიში და საბანი</option>
                        <option value="პირსახოცები">პირსახოცები</option>
                        <option value="ხალათები">ხალათები</option>
                        <option value="ფარდები">ფარდები</option>
                        <option value="მაგიდის გადასაფარებელი">მაგიდის გადასაფარებელი</option>
                        <option value="სხვა ტექსტილი">სხვა ტექსტილი</option>
                    </select>
                </div>

                <div class="form-group" id="sizeGroup" style="display: none;">
                    <label for="productSize">ზომა:</label>
                    <select id="productSize"></select>
                </div>

                <div class="form-group">
                    <label for="productPrice">ფასი (₾):</label>
                    <input type="number" id="productPrice" required>
                </div>

                <div class="form-group">
                    <label for="productDiscount">ფასდაკლება (% - სურვილისამებრ):</label>
                    <input type="number" id="productDiscount" placeholder="მაგ: 15" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="productDescription">აღწერა / ისტორია:</label>
                    <textarea id="productDescription" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label for="productImages">ფოტოები (მინიმუმ 1, მაქსიმუმ 5):</label>
                    <input type="file" id="productImages" accept="image/*" multiple required>
                    <div id="previewContainer" style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;"></div>
                </div>

                <button type="submit" id="submitBtn">პროდუქტის ატვირთვა</button>
                <div id="loading" style="display: none; text-align: center; color: #007bff; margin-top: 10px; font-weight: bold;">ინახება მონაცემები... გთხოვთ მოიცადოთ.</div>
            </form>

            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">

            <h2>ატვირთული პროდუქტების მართვა</h2>
            <div id="productsListContainer" style="margin-top: 15px;">
                <p style="color: #666;">იტვირთება პროდუქტები...</p>
            </div>
            
            <button class="logout-btn" onclick="logout()" style="margin-top: 20px;">გასვლა (Logout)</button>
        </div>
    </div>

    <!-- Firebase Compat სკრიპტები -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAzlIn043F7-ufK8xFlifDvj75zI1NsulM",
            authDomain: "ane-s-home.firebaseapp.com",
            projectId: "ane-s-home",
            storageBucket: "ane-s-home.appspot.com",
            messagingSenderId: "484380648627",
            appId: "1:484380648627:web:6e60a13212c65e02fdfcc6"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const authCard = document.getElementById('authCard');
        const adminContent = document.getElementById('adminContent');
        const loginBtn = document.getElementById('loginBtn');
        const adminUserInp = document.getElementById('adminUser');
        const adminPassInp = document.getElementById('adminPass');
        const loginLoading = document.getElementById('loginLoading');

        if (sessionStorage.getItem("isLoggedIn") === "true") {
            authCard.classList.add('hidden');
            adminContent.classList.remove('hidden');
            loadAdminProducts();
        }

        loginBtn.addEventListener('click', async () => {
            const enteredUser = adminUserInp.value.trim();
            const enteredPass = adminPassInp.value.trim();

            if (!enteredUser || !enteredPass) {
                alert('გთხოვთ შეავსოთ ორივე ველი!');
                return;
            }

            loginLoading.style.display = 'block';
            loginBtn.disabled = true;

            try {
                const docRef = await db.collection('settings').doc('adminCredentials').get();
                
                loginLoading.style.display = 'none';
                loginBtn.disabled = false;

                if (docRef.exists) {
                    const data = docRef.data();
                    if (enteredUser === data.username && enteredPass === data.password) {
                        sessionStorage.setItem("isLoggedIn", "true");
                        authCard.classList.add('hidden');
                        adminContent.classList.remove('hidden');
                        loadAdminProducts();
                    } else {
                        alert('არასწორი მეილი ან პაროლი!');
                    }
                } else {
                    await db.collection('settings').doc('adminCredentials').set({
                        username: "admin@aneshome.ge",
                        password: "ane-1990"
                    });
                    
                    if (enteredUser === "admin@aneshome.ge" && enteredPass === "ane-1990") {
                        sessionStorage.setItem("isLoggedIn", "true");
                        authCard.classList.add('hidden');
                        adminContent.classList.remove('hidden');
                        loadAdminProducts();
                    } else {
                        alert('არასწორი მეილი ან პაროლი!');
                    }
                }
            } catch (error) {
                loginLoading.style.display = 'none';
                loginBtn.disabled = false;
                console.error('შეცდომა:', error);
                alert('ავტორიზაციის შემოწმება ვერ მოხერხდა: ' + error.message);
            }
        });

        function logout() {
            sessionStorage.removeItem("isLoggedIn");
            adminContent.classList.add('hidden');
            authCard.classList.remove('hidden');
            adminUserInp.value = 'admin@aneshome.ge';
            adminPassInp.value = '';
        }

        const productForm = document.getElementById('productForm');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');
        const fileInput = document.getElementById('productImages');
        const previewContainer = document.getElementById('previewContainer');
        const categorySelect = document.getElementById('productCategory');
        const sizeGroup = document.getElementById('sizeGroup');
        const sizeSelect = document.getElementById('productSize');
        const productsListContainer = document.getElementById('productsListContainer');

        let base64Images = [];

        function updateSizes() {
            const cat = categorySelect.value;
            sizeSelect.innerHTML = '';
            let sizes = [];
            if (cat === 'თეთრეული') {
                sizes = ['ერთადგილიანი', 'ორადგილიანი', 'ევრო', 'ოჯახური'];
            } else if (cat === 'ბალიში და საბანი') {
                sizes = ['50x70 სმ', '70x70 სმ', '140x200 სმ (საბანი)', '200x220 სმ (საბანი)'];
            } else if (cat === 'პირსახოცები') {
                sizes = ['პატარა (სახის)', 'საშუალო (ხელის)', 'დიდი (აბაზანის)'];
            } else if (cat === 'ხალათები') {
                sizes = ['S / M', 'L / XL', '2XL'];
            } else if (cat === 'ფარდები' || cat === 'მაგიდის გადასაფარებელი') {
                sizes = ['სტანდარტული', 'ინდივიდუალური შეკვეთით'];
            }

            if (sizes.length > 0) {
                sizeGroup.style.display = 'flex';
                sizes.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s;
                    sizeSelect.appendChild(opt);
                });
            } else {
                sizeGroup.style.display = 'none';
            }
        }

        // პროდუქტების გამოტანა ინდექსის მოთხოვნის გარეშე
        async function loadAdminProducts() {
            productsListContainer.innerHTML = '<p style="color: #666;">იტვირთება პროდუქტები...</p>';
            try {
                const snapshot = await db.collection('products').get();
                if (snapshot.empty) {
                    productsListContainer.innerHTML = '<p style="color: #666;">ჯერ არ არის დამატებული არცერთი პროდუქტი.</p>';
                    return;
                }

                productsListContainer.innerHTML = '';
                snapshot.forEach(doc => {
                    const p = doc.data();
                    const id = doc.id;
                    const imgThumb = (p.images && p.images.length > 0) ? p.images[0] : '';

                    const div = document.createElement('div');
                    div.className = 'product-item';
                    div.innerHTML = `
                        <div class="product-info">
                            ${imgThumb ? `<img src="${imgThumb}" alt="">` : ''}
                            <div>
                                <strong>${p.name}</strong><br>
                                <small style="color: #666;">${p.category} - ${p.price}₾</small>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct('${id}')">წაშლა</button>
                    `;
                    productsListContainer.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                productsListContainer.innerHTML = '<p style="color: red;">პროდუქტების ჩატვირთვა ვერ მოხერხდა.</p>';
            }
        }

        window.deleteProduct = async function(id) {
            if (confirm('ნამდვილად გსურთ ამ პროდუქტის წაშლა?')) {
                try {
                    await db.collection('products').doc(id).delete();
                    alert('პროდუქტი წარმატებით წაიშალა!');
                    loadAdminProducts();
                } catch (err) {
                    console.error(err);
                    alert('წაშლა ვერ მოხერხდა: ' + err.message);
                }
            }
        };

        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));
                    }
                }
            });
        }

        fileInput.addEventListener('change', async (e) => {
            previewContainer.innerHTML = '';
            base64Images = [];
            const files = e.target.files;

            if (files.length > 5) {
                alert('მაქსიმუმ შეგიძლიათ აირჩიოთ 5 ფოტო!');
                fileInput.value = '';
                return;
            }

            for (let i = 0; i < files.length; i++) {
                const compressedDataUrl = await compressImage(files[i]);
                base64Images.push(compressedDataUrl);

                const img = document.createElement('img');
                img.src = compressedDataUrl;
                img.style.width = '70px';
                img.style.height = '70px';
                img.style.objectFit = 'cover';
                img.style.borderRadius = '4px';
                img.style.border = '1px solid #ddd';
                previewContainer.appendChild(img);
            }
        });

        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (base64Images.length === 0) {
                alert('გთხოვთ აირჩიოთ მინიმუმ ერთი ფოტო!');
                return;
            }

            loadingDiv.style.display = 'block';
            submitBtn.disabled = true;

            try {
                await db.collection('products').add({
                    name: document.getElementById('productName').value,
                    category: categorySelect.value,
                    size: sizeGroup.style.display !== 'none' ? sizeSelect.value : '',
                    price: Number(document.getElementById('productPrice').value),
                    discount: Number(document.getElementById('productDiscount').value) || 0,
                    history: document.getElementById('productDescription').value,
                    images: base64Images,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
                alert('პროდუქტი წარმატებით დაემატა!');
                productForm.reset();
                previewContainer.innerHTML = '';
                base64Images = [];
                sizeGroup.style.display = 'none';
                loadAdminProducts();

            } catch (error) {
                loadingDiv.style.display = 'none';
                submitBtn.disabled = false;
                console.error('შეცდომა:', error);
                alert('შენახვა ვერ მოხერხდა: ' + error.message);
            }
        });
    </script>

</body>
</html>
