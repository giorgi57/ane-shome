<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ane's home - ადმინ პანელი</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="content-wrapper">
        <header class="admin-header">
            <div class="header-container">
                <a href="index.html" class="logo">ane's <span>home</span> <small>(მთავარი)</small></a>
            </div>
        </header>

        <div class="container">
            <!-- ლოგინის სექცია -->
            <div id="login-section" class="auth-card">
                <h2><i class="fa-solid fa-lock"></i> ადმინისტრატორად შესვლა</h2>
                <div class="form-group">
                    <label>ელ-ფოსტა:</label>
                    <input type="email" id="admin-email" placeholder="admin@aneshome.ge">
                </div>
                <div class="form-group">
                    <label>პაროლი:</label>
                    <input type="password" id="admin-password" placeholder="******">
                </div>
                <button id="login-btn">შესვლა</button>
            </div>

            <!-- პროდუქტის ატვირთვის სექცია -->
            <div id="dashboard-section" class="hidden auth-card">
                <h2><i class="fa-solid fa-cloud-arrow-up"></i> ახალი პროდუქტის დამატება</h2>
                <form id="product-form">
                    <div class="form-group">
                        <label>პროდუქტის დასახელება:</label>
                        <input type="text" id="prod-name" placeholder="მაგ: სატინის ორადგილიანი თეთრეული" required>
                    </div>
                    
                    <div class="form-group">
                        <label>კატეგორია:</label>
                        <select id="prod-category" required>
                            <option value="თეთრეული">თეთრეული</option>
                            <option value="გადასაფარებელი">გადასაფარებელი</option>
                            <option value="ბალიში და საბანი">ბალიში და საბანი</option>
                            <option value="პირსახოცები">პირსახოცები</option>
                            <option value="ხალათები">ხალათები</option>
                            <option value="ფარდები">ფარდები</option>
                            <option value="მაგიდის გადასაფარებელი">მაგიდის გადასაფარებელი</option>
                            <option value="სხვა ტექსტილი">სხვა ტექსტილი</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ფასი (₾):</label>
                        <input type="number" id="prod-price" placeholder="მაგ: 150" required>
                    </div>

                    <div class="form-group">
                        <label>ფასდაკლება % (არასავალდებულო):</label>
                        <input type="number" id="prod-discount" placeholder="მაგ: 20">
                    </div>

                    <div class="form-group">
                        <label>ხარისხი / მასალა:</label>
                        <input type="text" id="prod-quality" placeholder="მაგ: 100% ბამბა, ევროპული სტანდარტი" required>
                    </div>

                    <div class="form-group">
                        <label>ისტორია / აღწერა:</label>
                        <textarea id="prod-history" placeholder="დაწერეთ პროდუქტის დეტალური ისტორია..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>პროდუქტის ფოტო:</label>
                        <input type="file" id="prod-image-file" accept="image/*" required>
                    </div>

                    <button type="submit" id="save-product-btn">პროდუქტის ატვირთვა</button>
                </form>

                <button id="logout-btn" class="logout-btn">სისტემიდან გამოსვლა</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, storage, ref, uploadBytes, getDownloadURL, signInWithEmailAndPassword, onAuthStateChanged, signOut, collection, addDoc } from "./firebase.js";

        const loginSection = document.getElementById("login-section");
        const dashboardSection = document.getElementById("dashboard-section");
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");
        const productForm = document.getElementById("product-form");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add("hidden");
                dashboardSection.classList.remove("hidden");
            } else {
                loginSection.classList.remove("hidden");
                dashboardSection.classList.add("hidden");
            }
        });

        loginBtn.addEventListener("click", () => {
            const email = document.getElementById("admin-email").value;
            const password = document.getElementById("admin-password").value;

            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    alert("შეცდომა ლოგინისას: " + error.message);
                });
        });

        logoutBtn.addEventListener("click", () => {
            signOut(auth);
        });

        productForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const name = document.getElementById("prod-name").value;
            const category = document.getElementById("prod-category").value;
            const price = Number(document.getElementById("prod-price").value);
            const discount = Number(document.getElementById("prod-discount").value) || 0;
            const quality = document.getElementById("prod-quality").value;
            const history = document.getElementById("prod-history").value;
            const imageFile = document.getElementById("prod-image-file").files[0];

            if (!imageFile) {
                alert("გთხოვთ აირჩიოთ ფოტო!");
                return;
            }

            const submitBtn = document.getElementById("save-product-btn");
            submitBtn.disabled = true;
            submitBtn.textContent = "იტვირთება ფოტო...";

            try {
                const storageRef = ref(storage, 'products/' + Date.now() + '_' + imageFile.name);
                const snapshot = await uploadBytes(storageRef, imageFile);
                const imageUrl = await getDownloadURL(snapshot.ref);

                await addDoc(collection(db, "products"), {
                    name: name,
                    category: category,
                    price: price,
                    discount: discount,
                    quality: quality,
                    history: history,
                    imageUrl: imageUrl,
                    createdAt: new Date()
                });

                alert("პროდუქტი წარმატებით აიტვირთა!");
                productForm.reset();
            } catch (error) {
                alert("შეცდომა ატვირთვისას: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "პროდუქტის ატვირთვა";
            }
        });
    </script>

</body>
</html>
